<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elaborador de ETP Profissional - IA Limpa</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; padding: 0; margin: 0; }
            .etp-doc { padding: 2cm; font-family: "Times New Roman", serif; color: black; }
            .etp-doc h2 { font-size: 12pt; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid black; margin-top: 15pt; padding-bottom: 3pt; }
            .etp-doc p { font-size: 11pt; text-align: justify; margin-bottom: 10pt; line-height: 1.5; white-space: pre-wrap; }
        }
        .print-only { display: none; }
        .textarea-clean { border: none; resize: none; width: 100%; outline: none; font-size: 0.875rem; line-height: 1.6; color: #334155; background: transparent; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .ai-glow { animation: glow 2s infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(99, 102, 241, 0.2); }
            to { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Fragment } = React;

        // Componente de Ícones SVG Inline - Estrutura robusta para o Babel
        const Icon = ({ name, size = 16, className = "" }) => {
            const icons = {
                FileText: (
                    <Fragment>
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>
                    </Fragment>
                ),
                ClipboardList: (
                    <Fragment>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
                    </Fragment>
                ),
                Target: (
                    <Fragment>
                        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                    </Fragment>
                ),
                CheckCircle: (
                    <Fragment>
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </Fragment>
                ),
                Sparkles: (
                    <Fragment>
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                        <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
                    </Fragment>
                ),
                Loader2: <path d="M21 12a9 9 0 1 1-6.219-8.56"/>,
                Printer: (
                    <Fragment>
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
                    </Fragment>
                ),
                Trash2: (
                    <Fragment>
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                    </Fragment>
                ),
                Layout: (
                    <Fragment>
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
                    </Fragment>
                ),
                BarChart: (
                    <Fragment>
                        <line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>
                    </Fragment>
                ),
                ShieldCheck: (
                    <Fragment>
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
                    </Fragment>
                ),
                Leaf: (
                    <Fragment>
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C10.9 14.36 12 11 12 11"/>
                    </Fragment>
                ),
                Settings: (
                    <Fragment>
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </Fragment>
                ),
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                Wand2: (
                    <Fragment>
                        <path d="m15 4 2 2"/><path d="m17 2 2 2"/>
                        <path d="m19 13-1.75 1.75c-.7.7-1.1 1.6-1.1 2.5a2 2 0 0 1-4 0c0-.9-.4-1.8-1.1-2.5L3 6l8-3 3 8Z"/>
                        <path d="m21 6-2 2"/><path d="m22 5-2 2"/>
                    </Fragment>
                ),
                Eye: (
                    <Fragment>
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </Fragment>
                ),
                Edit3: (
                    <Fragment>
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </Fragment>
                ),
                AlertTriangle: (
                    <Fragment>
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </Fragment>
                )
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={`${className} ${name === 'Loader2' ? 'animate-spin' : ''}`}
                >
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        // --- CONFIGURAÇÃO ---
        const apiKey = ""; // <--- INSIRA SUA CHAVE DO GOOGLE AI STUDIO AQUI
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        const SYSTEM_PROMPT = `Você é um consultor jurídico especializado em licitações (Lei 14.133/21). 
        REGRAS CRÍTICAS DE RESPOSTA:
        1. Forneça APENAS o texto técnico do tópico solicitado.
        2. NÃO use formatação Markdown (sem #, sem **, sem *, sem >).
        3. NÃO inclua introduções ou conclusões.
        4. NÃO inclua títulos no início.
        5. Use linguagem formal, impessoal e técnica.
        6. Se houver listas, use hífens (-) ou letras (a, b, c).`;

        function App() {
            const [formData, setFormData] = useState({
                objeto: '', necessidade: '', requisitos: '', levantamentoMercado: '',
                descricaoSolucao: '', estimativaQuantidades: '', justificativaParcelamento: '',
                resultadosEsperados: '', providencias: '', sustentabilidade: '', viabilidade: ''
            });

            const [isGenerating, setIsGenerating] = useState(null);
            const [isSaved, setIsSaved] = useState(false);
            const [viewMode, setViewMode] = useState('edit');
            const [apiError, setApiError] = useState(null);

            useEffect(() => {
                const savedData = localStorage.getItem('etp_pro_web_clean_v3');
                if (savedData) setFormData(JSON.parse(savedData));
            }, []);

            useEffect(() => {
                const timer = setTimeout(() => {
                    localStorage.setItem('etp_pro_web_clean_v3', JSON.stringify(formData));
                    setIsSaved(true);
                    setTimeout(() => setIsSaved(false), 2000);
                }, 1500);
                return () => clearTimeout(timer);
            }, [formData]);

            const callGemini = async (payload, retries = 5, delay = 1000) => {
                if (!apiKey) {
                    throw new Error("Chave de API não configurada. Por favor, insira sua chave do Google AI Studio no arquivo index.html.");
                }

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const errorMsg = errorData.error?.message || response.statusText || "Erro desconhecido";
                        
                        if (retries > 0 && (response.status === 429 || response.status >= 500)) {
                            await new Promise(r => setTimeout(r, delay));
                            return callGemini(payload, retries - 1, delay * 2);
                        }
                        
                        throw new Error(`${response.status}: ${errorMsg}`);
                    }

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!text) throw new Error("A IA retornou uma resposta vazia.");
                    return text;

                } catch (err) {
                    throw err;
                }
            };

            const handleAiAssist = async (fieldId) => {
                setApiError(null);
                setIsGenerating(fieldId);
                
                const fieldName = structure.find(s => s.id === fieldId)?.label;
                const prompt = `Escreva o texto técnico formal para a seção "${fieldName}" de um Estudo Técnico Preliminar oficial.
                CONTEXTO:
                Objeto: ${formData.objeto}
                Necessidade: ${formData.necessidade}
                Rascunho atual do usuário: "${formData[fieldId]}"`;

                try {
                    const result = await callGemini({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                    });
                    setFormData(prev => ({ ...prev, [fieldId]: result.trim() }));
                } catch (err) {
                    setApiError(err.message);
                } finally {
                    setIsGenerating(null);
                }
            };

            const handleGlobalGenerate = async () => {
                setApiError(null);
                setIsGenerating('global');
                const prompt = `Refine todo o ETP abaixo para conformidade total com a Lei 14.133/21. Melhore a coesão técnica e remova redundâncias entre os campos. DADOS: ${JSON.stringify(formData)}`;

                try {
                    const resultText = await callGemini({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    objeto: { type: "STRING" }, necessidade: { type: "STRING" },
                                    requisitos: { type: "STRING" }, levantamentoMercado: { type: "STRING" },
                                    descricaoSolucao: { type: "STRING" }, estimativaQuantidades: { type: "STRING" },
                                    justificativaParcelamento: { type: "STRING" }, resultadosEsperados: { type: "STRING" },
                                    providencias: { type: "STRING" }, sustentabilidade: { type: "STRING" },
                                    viabilidade: { type: "STRING" }
                                }
                            }
                        },
                        systemInstruction: { parts: [{ text: "Você é um revisor jurídico sênior da administração pública. Retorne JSON estruturado com os campos polidos, sem markdown." }] }
                    });
                    
                    // Tratamento seguro para a resposta JSON
                    const cleanJson = resultText.replace(/```json|```/g, '').trim();
                    const updatedData = JSON.parse(cleanJson);
                    setFormData(updatedData);
                    setViewMode('preview');
                } catch (err) {
                    setApiError(err.message);
                } finally {
                    setIsGenerating(null);
                }
            };

            const structure = [
                { id: 'objeto', label: '1. Descrição do Objeto', icon: 'Target' },
                { id: 'necessidade', label: '2. Descrição da Necessidade', icon: 'ClipboardList' },
                { id: 'requisitos', label: '3. Requisitos da Contratação', icon: 'ShieldCheck' },
                { id: 'levantamentoMercado', label: '4. Levantamento de Mercado', icon: 'BarChart' },
                { id: 'descricaoSolucao', label: '5. Descrição da Solução', icon: 'Layout' },
                { id: 'estimativaQuantidades', label: '6. Estimativa de Quantidades', icon: 'FileText' },
                { id: 'justificativaParcelamento', label: '7. Justificativa de Parcelamento', icon: 'Zap' },
                { id: 'resultadosEsperados', label: '8. Resultados Esperados', icon: 'CheckCircle' },
                { id: 'providencias', label: '9. Providências Prévias', icon: 'Settings' },
                { id: 'sustentabilidade', label: '10. Requisitos de Sustentabilidade', icon: 'Leaf' },
                { id: 'viabilidade', label: '11. Declaração de Viabilidade', icon: 'ShieldCheck' },
            ];

            return (
                <div className="min-h-screen pb-20 bg-slate-50 text-slate-900">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 no-print shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg">
                                    <Icon name="Wand2" size={18} />
                                </div>
                                <h1 className="text-sm font-black uppercase tracking-tight">ETP Digital <span className="text-indigo-600">Pro</span></h1>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setViewMode(viewMode === 'edit' ? 'preview' : 'edit')} className="flex items-center gap-2 bg-slate-100 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-200 transition-all">
                                    {viewMode === 'edit' ? <Fragment><Icon name="Eye" size={14} /> Visualizar</Fragment> : <Fragment><Icon name="Edit3" size={14} /> Editar</Fragment>}
                                </button>
                                <button onClick={handleGlobalGenerate} disabled={!!isGenerating} className={`flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-indigo-100 border border-indigo-200 transition-all disabled:opacity-50 ${!isGenerating ? 'ai-glow' : ''}`}>
                                    {isGenerating === 'global' ? <Icon name="Loader2" size={14} /> : <Icon name="Sparkles" size={14} />}
                                    Polimento Final
                                </button>
                                <button onClick={() => window.print()} className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-black transition-all">
                                    <Icon name="Printer" size={16} /> PDF
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-6 mt-8 no-print">
                        {apiError && (
                            <div className="mb-6 bg-red-50 border border-red-200 p-4 rounded-2xl flex items-center gap-4 text-red-800 animate-in fade-in slide-in-from-top duration-300">
                                <Icon name="AlertTriangle" size={24} className="flex-shrink-0" />
                                <div className="flex-1">
                                    <p className="font-bold text-sm">Atenção: Falha na IA</p>
                                    <p className="text-xs opacity-90 leading-relaxed">{apiError}</p>
                                    <p className="text-[10px] mt-2 opacity-60">Dica: Verifique se sua API Key foi inserida corretamente no código-fonte.</p>
                                </div>
                                <button onClick={() => setApiError(null)} className="p-1 hover:bg-red-100 rounded transition-colors self-start">OK</button>
                            </div>
                        )}

                        {viewMode === 'edit' ? (
                            <div className="flex flex-col lg:flex-row gap-8">
                                <aside className="hidden lg:block w-64 space-y-1 sticky top-24 h-fit">
                                    <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest px-4 mb-3">Tópicos do Estudo</p>
                                    {structure.map(item => (
                                        <button key={item.id} onClick={() => document.getElementById(item.id)?.scrollIntoView({behavior:'smooth', block:'center'})} className="w-full text-left px-4 py-2.5 rounded-xl text-[11px] font-bold text-slate-500 hover:bg-white hover:text-indigo-600 transition-all flex items-center justify-between group">
                                            <span className="flex items-center gap-2">
                                                <Icon name={item.icon} size={14} className="opacity-50 group-hover:opacity-100" />
                                                {item.label}
                                            </span>
                                            {formData[item.id].length > 10 && <Icon name="CheckCircle" size={12} className="text-green-500" />}
                                        </button>
                                    ))}
                                </aside>
                                <div className="flex-1 space-y-6">
                                    {structure.map((item, idx) => (
                                        <div key={item.id} id={item.id} className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden scroll-mt-24 transition-all hover:border-indigo-100 focus-within:border-indigo-300 focus-within:shadow-md">
                                            <div className="px-6 py-3 bg-slate-50 border-b flex justify-between items-center">
                                                <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500">{item.label}</h3>
                                                <button onClick={() => handleAiAssist(item.id)} disabled={isGenerating !== null} className="text-[9px] font-black text-indigo-600 uppercase bg-white border border-indigo-100 px-3 py-1.5 rounded-full hover:bg-indigo-50 flex items-center gap-2 shadow-sm transition-all disabled:opacity-50">
                                                    {isGenerating === item.id ? <Icon name="Loader2" size={10} /> : <Icon name="Sparkles" size={10} />}
                                                    Gerar com IA
                                                </button>
                                            </div>
                                            <div className="p-6">
                                                <textarea value={formData[item.id]} onChange={(e) => setFormData({...formData, [item.id]: e.target.value})} className="textarea-clean min-h-[160px]" placeholder="Preencha as informações principais ou clique em 'Gerar com IA' para uma redação técnica formal..."/>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white shadow-2xl p-16 border border-slate-200 max-w-4xl mx-auto etp-doc rounded-3xl animate-in fade-in duration-500">
                                <div className="text-center mb-12 border-b-2 border-black pb-8">
                                    <div className="w-16 h-16 border-2 border-black flex items-center justify-center mx-auto mb-4 font-black text-[8px] uppercase">Brasão / Logo</div>
                                    <h1 className="text-xl font-bold uppercase underline tracking-tight">Estudo Técnico Preliminar (ETP)</h1>
                                    <p className="text-sm font-bold mt-2">Lei Federal nº 14.133/2021</p>
                                    <div className="mt-6 flex justify-between text-[10px] font-bold uppercase text-slate-400">
                                        <p>Data: {new Date().toLocaleDateString('pt-BR')}</p>
                                        <p>Documento Gerado Digitalmente</p>
                                    </div>
                                </div>
                                {structure.map(item => (
                                    <div key={item.id} className="mb-10">
                                        <h2 className="text-sm font-bold uppercase border-b border-slate-300 mb-4 pb-1">{item.label}</h2>
                                        <div className="text-sm text-justify leading-relaxed whitespace-pre-wrap text-slate-800">
                                            {formData[item.id] || "Campo pendente de preenchimento pelo setor requisitante."}
                                        </div>
                                    </div>
                                ))}
                                <div className="mt-20 flex justify-between gap-12 pt-10 border-t border-slate-100">
                                    <div className="flex-1 text-center border-t border-black pt-2">
                                        <p className="text-[10px] font-bold uppercase">Assinatura do Elaborador</p>
                                    </div>
                                    <div className="flex-1 text-center border-t border-black pt-2">
                                        <p className="text-[10px] font-bold uppercase">Autoridade Competente</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Versão de Impressão */}
                    <div className="print-only etp-doc">
                        <div style={{textAlign: 'center', marginBottom: '40px', borderBottom: '2px solid black', paddingBottom: '20px'}}>
                            <h1 style={{fontSize: '16pt', fontWeight: 'bold', textTransform: 'uppercase'}}>Estudo Técnico Preliminar</h1>
                            <p style={{fontSize: '10pt'}}>Administração Pública Direta e Indireta - Lei 14.133/21</p>
                        </div>
                        {structure.map(item => (
                            <div key={item.id} style={{marginBottom: '25px'}}>
                                <h2>{item.label}</h2>
                                <p>{formData[item.id] || "Não preenchido."}</p>
                            </div>
                        ))}
                    </div>

                    {isGenerating === 'global' && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 no-print">
                            <div className="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-sm animate-in zoom-in">
                                <Icon name="Loader2" size={40} className="mx-auto mb-4 text-indigo-600" />
                                <h3 className="font-black text-slate-800 uppercase tracking-tighter text-lg">Consolidando Documento</h3>
                                <p className="text-slate-500 text-xs font-medium leading-relaxed">A IA está revisando a coesão técnica e aplicando as normas da Lei 14.133/21 em todos os campos...</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
